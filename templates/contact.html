<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Foty.AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Foty.AI</div>
            <ul>
                <li><a href="{{ url_for('backhome') }}">Home</a></li>
                <li><a href="{{ url_for('about') }}">About</a></li>
                <li><a href="{{ url_for('analyzer') }}">Analyzer</a></li>
                <li><a href="{{ url_for('contact') }}" class="active">Contact</a></li>
                {% if user %}
                    <li class="profile-item">
                        <a href="{{ url_for('profile') }}" class="profile-link">
                            <div class="profile-image-container">
                                <img src="{{ url_for('static', filename=user.image) if user.image else url_for('static', filename='images/default-avatar.jpg') }}" 
                                     alt="Profile" class="profile-image" id="profileImage">
                            </div>
                        </a>
                    </li>
                {% else %}
                    <li><a href="{{ url_for('login') }}" class="login-btn">Login</a></li>
                {% endif %}
            </ul>
        </nav>
    </header>

    <main>
        <section class="contact-section">
            <h1>Contact Us</h1>
            <p>If you have any questions or need support, feel free to reach out to us.</p>
            
            <div class="contact-form">
                <form class="contact-us-form" method="POST" action="{{ url_for('send_contact') }}">
                    <div class="form-group">
                        <label for="name">Name</label>
                        <input type="text" id="name" name="name" required placeholder="Your Name">
                    </div>
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required placeholder="your.email@example.com">
                    </div>
                    <div class="form-group">
                        <label for="message">Message</label>
                        <textarea id="message" name="message" required placeholder="Your Message"></textarea>
                    </div>
                    <button type="submit" class="btn-primary">Send Message</button>
                </form>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2025 Foty.AI. All rights reserved.</p>
    </footer>

    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
